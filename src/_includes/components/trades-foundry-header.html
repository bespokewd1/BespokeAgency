<style>
  .tf-masthead {
    --tf-ink: #0A0A0A;
    --tf-ink-soft: #1A1A1A;
    --tf-muted: #5C5A55;
    --tf-paper: #F4F1E6;
    --tf-paper-2: #FAF7EE;
    --tf-paper-edge: #E9E4D2;
    --tf-rule: rgba(10, 10, 10, 0.16);
    --tf-rule-strong: rgba(10, 10, 10, 0.45);
    --tf-blue: #4594F2;
    --tf-blue-deep: #0E3A8C;
    --tf-blue-soft: #E0EBFB;
    --tf-rust: #C24914;
    --tf-rust-soft: #F6E1D3;
    --tf-paper-white: #FAFAFA;
    --tf-bg-light: #F9F9F9;
    --tf-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --tf-body: 'Familjen Grotesk', system-ui, sans-serif;
    --tf-mono: 'JetBrains Mono', ui-monospace, monospace;
    --tf-script: 'Newsreader', Georgia, serif;
    --tf-radius: 0;
    --tf-radius-soft: 0.25rem;
    border-bottom: 0.125rem solid var(--tf-ink);
    background: var(--tf-paper);
    color: var(--tf-ink);
    font-family: var(--tf-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'ss01', 'cv05';
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .tf-mast-strip {
    background: var(--tf-ink);
    color: var(--tf-paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.4375rem 2rem;
    font-family: var(--tf-mono);
    font-size: 0.65625rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .tf-mast-strip-item { white-space: nowrap; }
  .tf-hide-sm { display: none; }

  @media (min-width: 57.5rem) {
    .tf-hide-sm { display: inline; }
  }

  .tf-mast-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    padding: 1rem min(2rem, 3vw);
  }

  .tf-mast-logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: var(--tf-display);
    font-weight: 800;
    font-size: 1.375rem;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: var(--tf-ink);
    text-decoration: none;
  }

  .tf-mast-logo .cs-logo-img {
    filter: drop-shadow(0.0625rem 0.0625rem black) drop-shadow(0.0625rem -0.0625rem black)
      drop-shadow(-0.0625rem 0.0625rem black) drop-shadow(-0.0625rem -0.0625rem black);
    width: 1.5rem;
    height: 1.5rem;
    object-fit: contain;
    flex: 0 0 auto;
  }

  .tf-mast-word {
    font-family: var(--tf-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .tf-mast-word em {
    font-family: var(--tf-script);
    font-style: italic;
    font-weight: 500;
    text-transform: none;
    color: var(--tf-blue);
    margin: 0 0.125rem;
    font-size: 0.92em;
    letter-spacing: 0;
  }

  .tf-mast-nav {
    display: flex;
    align-items: center;
    gap: 1.625rem;
  }

  .tf-mast-nav > a:not(.tf-mast-cta) {
    font-family: var(--tf-body);
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--tf-ink);
    text-decoration: none;
    position: relative;
    padding-bottom: 0.125rem;
  }

  .tf-mast-nav > a:not(.tf-mast-cta)::after {
    content: '';
    position: absolute;
    left: 0;
    right: 100%;
    bottom: 0;
    height: 0.125rem;
    background: var(--tf-ink);
    transition: right 0.32s ease;
  }

  .tf-mast-nav > a:not(.tf-mast-cta):hover::after { right: 0; }

  @media (max-width: 63.9375rem) {
    .tf-mast-nav > a:not(.tf-mast-cta) { display: none; }
  }

  .tf-mast-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--tf-ink);
    color: var(--tf-paper);
    text-decoration: none;
    padding: 0.625rem 1.125rem;
    font-family: var(--tf-display);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.875rem;
    letter-spacing: 0.04em;
    border: 0.125rem solid var(--tf-ink);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .tf-mast-cta:hover {
    background: var(--tf-blue);
    border-color: var(--tf-blue);
    color: #fff;
  }

  .tf-mast-cta:hover .tf-arrow { transform: translateX(0.1875rem); }

  .tf-menu-toggle,
  .tf-menu-close {
    appearance: none;
    border: 0.125rem solid var(--tf-ink);
    border-radius: 0;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    color: var(--tf-paper);
    background: var(--tf-ink);
    transition:
      background 0.2s ease,
      color 0.2s ease,
      border-color 0.2s ease,
      transform 0.2s ease;
  }

  .tf-menu-toggle {
    width: 3rem;
    height: 2.75rem;
  }

  .tf-menu-toggle:hover,
  .tf-menu-close:hover {
    background: var(--tf-blue);
    border-color: var(--tf-blue);
    color: #fff;
  }

  .tf-menu-toggle:active,
  .tf-menu-close:active {
    transform: translateY(0.0625rem);
  }

  .tf-menu-toggle-icon,
  .tf-menu-close-icon {
    width: 1.35rem;
    height: 1.35rem;
    display: block;
  }

  .tf-menu-dialog {
    width: min(28rem, calc(100vw - 1.5rem));
    max-width: calc(100vw - 1.5rem);
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--tf-ink);
    position: fixed;
    inset: 0.75rem 0.75rem auto auto;
    overflow: visible;
  }

  .tf-menu-dialog::backdrop {
    background: rgba(10, 10, 10, 0.5);
    -webkit-backdrop-filter: blur(0.125rem);
    backdrop-filter: blur(0.125rem);
    animation: tf-menu-backdrop-in 0.24s ease both;
  }

  .tf-menu-dialog.is-closing::backdrop {
    animation: tf-menu-backdrop-out 0.2s ease both;
  }

  .tf-menu-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 95dvh;
    max-height: calc(100dvh - 1.5rem);
    overflow: hidden auto;
    background: var(--tf-paper);
    border: 0.125rem solid var(--tf-ink);
    box-shadow: 0.5rem 0.5rem 0 var(--tf-ink);
    animation: tf-menu-panel-in 0.26s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  .tf-menu-dialog.is-closing .tf-menu-panel {
    animation: tf-menu-panel-out 0.2s ease both;
  }

  .tf-menu-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--tf-rule) 0.0625rem, transparent 0.0625rem),
      linear-gradient(to bottom, var(--tf-rule) 0.0625rem, transparent 0.0625rem);
    background-size: 2.75rem 2.75rem;
    opacity: 0.42;
    pointer-events: none;
  }

  .tf-menu-head,
  .tf-menu-nav,
  .tf-menu-actions {
    position: relative;
    z-index: 1;
  }

  .tf-menu-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.875rem;
    border-bottom: 0.125rem solid var(--tf-ink);
    background: var(--tf-paper-2);
  }

  .tf-menu-kicker {
    display: inline-flex;
    align-items: center;
    gap: 0.625rem;
    font-family: var(--tf-mono);
    font-size: 0.6875rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--tf-muted);
  }

  .tf-menu-kicker::before {
    content: '';
    width: 0.5rem;
    height: 0.5rem;
    background: var(--tf-rust);
    box-shadow: 0 0 0 0.25rem var(--tf-rust-soft);
  }

  .tf-menu-close {
    display: inline-flex;
    width: 2.5rem;
    height: 2.5rem;
  }

  .tf-menu-nav { display: grid; }

  .tf-menu-nav a,
  .tf-menu-call {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 1rem;
    min-height: 4.25rem;
    padding: 0.875rem 1rem;
    border-bottom: 0.125rem solid var(--tf-ink);
    font-family: var(--tf-display);
    font-size: clamp(1.65rem, 6vw, 2.35rem);
    font-weight: 900;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--tf-ink);
    text-decoration: none;
    transition:
      background 0.2s ease,
      color 0.2s ease,
      padding-left 0.2s ease;
  }

  .tf-menu-nav a:last-child { border-bottom: 0; }
  .tf-menu-nav a > span:first-child { min-width: 0; }

  .tf-menu-nav a > span:last-child,
  .tf-menu-call > span:last-child {
    font-family: var(--tf-mono);
    font-size: 0.6875rem;
    letter-spacing: 0.14em;
    color: var(--tf-muted);
  }

  .tf-menu-nav a:hover,
  .tf-menu-call:hover {
    background: var(--tf-ink);
    color: var(--tf-paper);
    padding-left: 1.25rem;
  }

  .tf-menu-nav a:hover > span:last-child,
  .tf-menu-call:hover > span:last-child {
    color: var(--tf-blue);
  }

  .tf-menu-actions {
    margin-top: auto;
    padding: 1rem;
    border-top: 0.125rem solid var(--tf-ink);
    background: var(--tf-paper-2);
  }

  .tf-menu-call {
    border: 0.125rem solid var(--tf-ink);
    background: var(--tf-blue);
    color: #fff;
    min-height: 4.5rem;
    border-bottom: 0.125rem solid var(--tf-ink);
  }

  .tf-menu-call > span:last-child { color: var(--tf-blue-deep); }
  .tf-menu-call:hover { background: var(--tf-rust); }

  @keyframes tf-menu-panel-in {
    from {
      opacity: 0;
      transform: translateY(-0.75rem) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes tf-menu-panel-out {
    from {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    to {
      opacity: 0;
      transform: translateY(-0.5rem) scale(0.98);
    }
  }

  @keyframes tf-menu-backdrop-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes tf-menu-backdrop-out {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  html.tf-menu-open,
  html.tf-menu-open body {
    overflow: hidden;
  }

  @media (max-width: 63.9375rem) {
    .tf-mast-bar { gap: 1rem; }
    .tf-mast-cta { display: none; }
    .tf-menu-toggle { display: inline-flex; }
  }

  @media (max-width: 36.25rem) {
    .tf-mast-strip { padding-inline: 1rem; }
    .tf-mast-bar { padding: 0.875rem 1rem; }
    .tf-mast-logo {
      gap: 0.5rem;
      font-size: 1.125rem;
    }
    .tf-menu-dialog {
      width: calc(100vw - 1rem);
      max-width: calc(100vw - 1rem);
      inset: 0.5rem 0.5rem auto auto;
    }
  }
</style>

    <button

    >
      <svg

        class="tf-menu-toggle-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 6h16" />
        <path d="M4 12h16" />
        <path d="M4 18h16" />
      </svg>
    </button>
    <dialog
      class="tf-menu-dialog"
      id="tf-menu-dialog"
      aria-labelledby="tf-menu-title"
    >
      <div class="tf-menu-panel">
        <div class="tf-menu-head">
          <span class="tf-menu-kicker" id="tf-menu-title">Navigation</span>
          <button
            class="tf-menu-close"
            type="button"
            aria-label="Close navigation menu"
          >
            <svg
              aria-hidden="true"
              class="tf-menu-close-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"

            >

<script>
  (function () {
    var header =
      document.currentScript &&
      document.currentScript.previousElementSibling &&
      document.currentScript.previousElementSibling.classList.contains("tf-masthead")
        ? document.currentScript.previousElementSibling
        : document.querySelector(".tf-masthead");
    if (!header || header.dataset.tfMenuReady === "true") return;
    header.dataset.tfMenuReady = "true";

    var dialog = header.querySelector("#tf-menu-dialog");
    var openButton = header.querySelector(".tf-menu-toggle");
    var closeButton = header.querySelector(".tf-menu-close");
    if (!dialog || !openButton || !closeButton) return;

    var lastFocused = null;
    var closeDelay = 220;

    function openMenu() {
      if (dialog.open) return;
      lastFocused = document.activeElement;
      dialog.classList.remove("is-closing");
      if (typeof dialog.showModal === "function") {
        dialog.showModal();
      } else {
        dialog.setAttribute("open", "");
      }
      openButton.setAttribute("aria-expanded", "true");
      document.documentElement.classList.add("tf-menu-open");
      closeButton.focus({ preventScroll: true });
    }

    function closeMenu(restoreFocus) {
      if (!dialog.open || dialog.classList.contains("is-closing")) return;
      dialog.classList.add("is-closing");
      openButton.setAttribute("aria-expanded", "false");
      document.documentElement.classList.remove("tf-menu-open");

      window.setTimeout(function () {
        dialog.classList.remove("is-closing");
        if (typeof dialog.close === "function") {
          dialog.close();
        } else {
          dialog.removeAttribute("open");
        }
        if (restoreFocus !== false && lastFocused && lastFocused.focus) {
          lastFocused.focus({ preventScroll: true });
        }
      }, closeDelay);
    }

    openButton.addEventListener("click", openMenu);
    closeButton.addEventListener("click", function () {
      closeMenu(true);
    });
    dialog.addEventListener("click", function (event) {
      if (event.target === dialog) closeMenu(true);
    });
    dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      closeMenu(true);
    });
    dialog.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        closeMenu(false);
      });
    });
  })();
</script>
